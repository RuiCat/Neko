# dsh-astrbox 聚合 bundle patch
#
# 组件：mcp-astrbox / astrbox-bridge / im-qqbot / diary / bilibili。
# 5 行都是裸包名：profile 的 node_modules 里必须有同名包（`link:` 安装不会安装
# 被链包自己的 dependencies）。子功能包（dsh-mcp-client / qqbot / diary / bilibili）
# 由 profile 以纯依赖方式安装、不声明 dsh.bundle，因此不会各自出现在插件列表里。
# 全部不写 config：运行配置由各插件从 ~/.dsh-neko/Neko/data/<组件>.json 读取；
# MCP 启动参数默认指向 ~/.dsh-neko/Neko/bin/dsh-mcp（可用 mcp-astrbox.json 覆盖）。
- insert:
    - id: mcp-astrbox
      name: 'dsh-mcp-client'

- insert:
    - id: astrbox-bridge
      name: 'dsh-astrbox'

- insert:
    - id: im-qqbot
      name: '@tencent-connect/dsh-qqbot'

- insert:
    - id: diary
      name: 'dsh-plugin-diary'

- insert:
    - id: bilibili
      name: 'dsh-plugin-bilibili'
