<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neko Monitor</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body,
      #monitor-root {
        height: 100%;
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-family);
        overflow: hidden;
      }
      .monitor-app {
        height: 100vh;
        max-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: var(--space-8);
        padding: var(--space-8);
        box-sizing: border-box;
        overflow: hidden;
      }
      .monitor-app > .petui-panel__body {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .monitor-header {
        flex: 0 0 auto;
      }
      .monitor-header .petui-panel__body {
        display: flex;
        align-items: center;
        gap: var(--space-8);
      }
      .monitor-header .petui-navbar {
        flex: 1 1 auto;
      }
      .monitor-split {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .monitor-split .petui-panel {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .monitor-split .petui-sp-panel {
        min-width: 0;
        overflow: hidden;
      }
      .monitor-split .petui-description-list {
        max-width: 100%;
        min-width: 0;
      }
      .monitor-split .petui-description-list__item {
        min-width: 0;
        overflow: hidden;
      }
      .monitor-split .petui-panel__body {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .monitor-split .petui-tree-view {
        max-height: 100%;
      }
      .monitor-split .petui-description-list,
      .monitor-split .petui-data-table {
        max-height: 100%;
        overflow: auto;
      }
      .monitor-split .petui-tree-view-list {
        overflow-y: scroll !important;
      }
      .monitor-split ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      .monitor-split ::-webkit-scrollbar-track {
        background: transparent;
      }
      .monitor-split ::-webkit-scrollbar-thumb {
        background: var(--color-text-muted);
        border-radius: var(--space-4);
      }
      .monitor-split [data-role="tab-pane"] {
        scrollbar-gutter: stable;
      }
      .monitor-split ::-webkit-scrollbar-thumb:hover {
        background: var(--color-primary);
      }
    </style>
    <script src="./vendor/PetUI.js"></script>
  </head>
  <body>
    <div id="monitor-root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
